# AI security review, gated on the safe_for_review label.
#
# pull_request_target runs in the base repository's context, so OIDC
# credentials are available for pull requests from forks, which a plain
# pull_request run never gets.
#
# The job condition tests github.event.label.name, the label added by the
# triggering event. Do not change it to a check that the label is present on
# the PR: while the label remains, any later labeled event would re-run the
# review against whatever commit is then the head, with no maintainer
# involved.
#
# Nothing from the PR is checked out. The workspace holds the base branch and
# the diff is read over the GitHub API, so PR code never runs, and Bash is not
# available to the reviewer.
#
# The review instructions are fetched at run time and masked in the log.
# Findings are stored privately; the PR gets one comment with only a count.
# show_full_output and display_report stay off so no model output reaches
# the public log or step summary.

name: ClaudeSecurityReview

on:
  pull_request_target:
    types: [ labeled ]

permissions: {}

jobs:
  review:
    name: Claude Security Review
    if: ${{ github.event.label.name == 'safe_for_review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only on PRs: the agent runs in this job, so its token must not be
    # able to write to GitHub even if the tool allowlist were bypassed.
    # Comments are posted by the separate `comment` job below.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      result: ${{ steps.publish.outputs.result }}
      count: ${{ steps.publish.outputs.count }}
      high: ${{ steps.publish.outputs.high }}
      medium: ${{ steps.publish.outputs.medium }}
      low: ${{ steps.publish.outputs.low }}
    env:
      REVIEW_BUCKET: aws-privateca-issuer-security-review-yhanley-us-east-1
      PROMPT_SECRET: SecurityReviewPrompt-yhanley-us-east-1
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::992382396819:role/GithubActionsSecurityReviewRole-yhanley-us-east-1
          aws-region: us-east-1

      - name: Fetch review instructions
        id: instructions
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value --secret-id "$PROMPT_SECRET" \
            --query SecretString --output text > /tmp/review-prompt.md
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done < /tmp/review-prompt.md
          {
            echo 'text<<CLAUDE_PROMPT_EOF'
            cat /tmp/review-prompt.md
            echo 'CLAUDE_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Claude security review
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@c335fd6d1b8bce8aad42d9eb68d14929b15de8da # v1.0.254
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: 'true'
          allowed_bots: ''
          allowed_non_write_users: ''
          show_full_output: 'false'
          display_report: 'false'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            ${{ steps.instructions.outputs.text }}
          claude_args: |
            --model us.anthropic.claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Task,mcp__github__get_pull_request_diff"
            --disallowed-tools "WebFetch,WebSearch,Bash,Write,Edit"
            --json-schema '{"type":"object","properties":{"findings_count":{"type":"integer","minimum":0},"high":{"type":"integer","minimum":0,"description":"Number of reported findings with Severity High"},"medium":{"type":"integer","minimum":0,"description":"Number of reported findings with Severity Medium"},"low":{"type":"integer","minimum":0,"description":"Number of reported findings with Severity Low"},"report_markdown":{"type":"string"}},"required":["findings_count","high","medium","low","report_markdown"]}'

      # The report is read from the execution file by path, never via an
      # expression or env var: either would print it into this public log.
      - name: Publish findings
        id: publish
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -uo pipefail
          PREFIX="reviews/pr-${PR_NUMBER}/${HEAD_SHA}"
          if [ -n "${EXECUTION_FILE}" ] && [ -s "${EXECUTION_FILE}" ]; then
            aws s3 cp "${EXECUTION_FILE}" "s3://${REVIEW_BUCKET}/${PREFIX}.transcript.json" --quiet || true
            jq -c '[.[] | select(.type == "result")] | last | .structured_output // empty' \
              "${EXECUTION_FILE}" > /tmp/structured.json 2>/dev/null || true
          fi
          COUNT=""
          if [ -s /tmp/structured.json ]; then
            COUNT=$(jq -r '.findings_count | select(type == "number" and . >= 0 and floor == .)' /tmp/structured.json 2>/dev/null)
            read -r HIGH MEDIUM LOW < <(jq -r '[.high, .medium, .low] | map(select(type == "number" and . >= 0 and floor == .)) | if length == 3 then join(" ") else "" end' /tmp/structured.json 2>/dev/null) || true
            if [ -n "$COUNT" ] && { [ -z "${LOW:-}" ] || [ $((HIGH + MEDIUM + LOW)) -ne "$COUNT" ]; }; then
              COUNT=""
            fi
            jq -r '.report_markdown // empty' /tmp/structured.json > /tmp/findings.md 2>/dev/null
          fi
          if [ -z "$COUNT" ] || [ ! -s /tmp/findings.md ]; then
            echo "result=incomplete" >> "$GITHUB_OUTPUT"
          else
            { printf 'Reviewed commit: %s\n\n' "${HEAD_SHA}"; cat /tmp/findings.md; } > /tmp/report.md
            if aws s3 cp /tmp/report.md "s3://${REVIEW_BUCKET}/${PREFIX}.md" --quiet; then
              echo "result=complete" >> "$GITHUB_OUTPUT"
              echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
              echo "high=${HIGH}" >> "$GITHUB_OUTPUT"
              echo "medium=${MEDIUM}" >> "$GITHUB_OUTPUT"
              echo "low=${LOW}" >> "$GITHUB_OUTPUT"
            else
              echo "result=incomplete" >> "$GITHUB_OUTPUT"
            fi
          fi

  # No AWS credentials and no model in this job: it only turns the count
  # into a PR comment.
  comment:
    name: Post Review Result
    needs: review
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.label.name == 'safe_for_review' }}
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.review.outputs.result }}
          COUNT: ${{ needs.review.outputs.count }}
          HIGH: ${{ needs.review.outputs.high }}
          MEDIUM: ${{ needs.review.outputs.medium }}
          LOW: ${{ needs.review.outputs.low }}
        run: |
          set -euo pipefail
          if [ "${RESULT}" != "complete" ] || ! [[ "${COUNT}" =~ ^[0-9]+$ ]]; then
            BODY="Automated security review did not complete for \`${HEAD_SHA}\`. See the workflow run."
          elif [ "${COUNT}" -eq 0 ]; then
            BODY="Automated security review found no issues in \`${HEAD_SHA}\`."
          else
            BODY="Automated security review found ${COUNT} potential issue(s) in \`${HEAD_SHA}\`: **${HIGH} high, ${MEDIUM} medium, ${LOW} low**. Details are available to maintainers."
          fi
          # One comment per commit: a re-run of the same SHA updates its own
          # comment, and a new push gets a new one, so earlier results stay.
          MARKER="<!-- claude-security-review:${HEAD_SHA} -->"
          BODY="${BODY}"$'\n\n'"${MARKER}"
          EXISTING=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\")))] | last | .id // empty")
          if [ -n "${EXISTING}" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${EXISTING}" -f body="${BODY}" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi

  remove-label:
    name: Remove Review Label
    needs: [ review, comment ]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.label.name == 'safe_for_review' }}
    permissions:
      pull-requests: write
    steps:
      - name: Remove label
        uses: aws-pca-k8s-plugin-ops-admin/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0
        with:
          labels:
            'safe_for_review'
          fail_on_error: 'false'
